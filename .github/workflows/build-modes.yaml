# The build modes R-CMD-check.yaml does not reach: linking a system libhs
# (VECTORSCAN_USE_SYSTEM), the runtime-stub build (VECTORSCAN_ALLOW_STUBS), and
# the two PCRE2 routes for hs_capture() (VECTORSCAN_PCRE2=system|vendored).
#
# Both are development conveniences, and both rot silently if nothing builds
# them: the system path is what a distribution packager would use, and the
# stub path is what keeps hs_available() and the skip_if_not(hs_available())
# guards in the tests, examples and vignettes honest.
#
# Plain r-lib/actions steps rather than pedrobtz/r-actions, because the
# system job needs an apt package the reusable workflow has no input for.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: build-modes

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-mode:
    runs-on: ubuntu-latest
    name: ${{ matrix.mode }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu's libhyperscan-dev (Intel Hyperscan 5.4) found through
          # pkg-config libhs; the bundled source must not be built.
          - mode: system
            pc-module: libhs
            apt: libhyperscan-dev pkg-config
            use-system: "true"
            allow-stubs: ""
            pcre2: auto
            expect: "Vectorscan/Hyperscan support enabled"
            forbid: "building bundled Vectorscan"
            hs-available: "TRUE"
          # No libhs anywhere and stubs allowed: the package must install,
          # report hs_available() == FALSE, and skip the native tests.
          - mode: stubs
            apt: ""
            use-system: "true"
            allow-stubs: "true"
            pcre2: auto
            expect: "runtime stubs because VECTORSCAN_ALLOW_STUBS is set"
            forbid: "building bundled Vectorscan"
            hs-available: "FALSE"
          # PCRE2 for hs_capture(), from the system: Ubuntu's libpcre2-dev,
          # the same library R loads.
          - mode: pcre2-system
            pc-module: libpcre2-8
            apt: libpcre2-dev pkg-config
            use-system: ""
            allow-stubs: ""
            pcre2: system
            expect: "(system)"
            forbid: "building vendored PCRE2"
            hs-available: "TRUE"
            pcre2-source: system
          # The vendored PCRE2 in the setting where a clash could happen: a
          # system PCRE2 is installed and loaded by R. The package's .so must
          # export no pcre2_* symbol, so nothing can resolve to R's copy.
          - mode: pcre2-vendored
            pc-module: libpcre2-8
            apt: libpcre2-dev pkg-config
            use-system: ""
            allow-stubs: ""
            pcre2: vendored
            expect: "(vendored)"
            forbid: ""
            hs-available: "TRUE"
            pcre2-source: vendored

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      VECTORSCAN_USE_SYSTEM: ${{ matrix.use-system }}
      VECTORSCAN_ALLOW_STUBS: ${{ matrix.allow-stubs }}
      VECTORSCAN_PCRE2: ${{ matrix.pcre2 }}

    steps:
      - uses: actions/checkout@v6

      - name: Install the system library
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}
          pkg-config --modversion ${{ matrix.pc-module }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          upload-snapshots: true

      # R CMD check passing is not enough: a stub build also passes, because
      # every native test is skipped. Check that configure took the intended
      # path, and that the installed package agrees.
      - name: Confirm the build mode
        env:
          EXPECT: ${{ matrix.expect }}
          FORBID: ${{ matrix.forbid }}
          MODE: ${{ matrix.mode }}
          WANT_HS: ${{ matrix.hs-available }}
          WANT_PCRE2: ${{ matrix.pcre2-source }}
        run: |
          set -eu
          log=check/vectorscan.Rcheck/00install.out
          grep -F "configure:" "$log"
          grep -qF "$EXPECT" "$log"
          if [ -n "$FORBID" ] && grep -qF "$FORBID" "$log"; then
            echo "::error::'$FORBID' happened in the $MODE job"
            exit 1
          fi
          # rcmdcheck installs the package into the check directory only.
          export R_LIBS="check/vectorscan.Rcheck"
          got=$(Rscript -e 'cat(vectorscan::hs_available())')
          echo "hs_available() = $got (expected $WANT_HS)"
          [ "$got" = "$WANT_HS" ]
          if [ -n "$WANT_PCRE2" ]; then
            src=$(Rscript -e 'cat(vectorscan:::pcre2_info()$source)')
            echo "PCRE2 source = $src (expected $WANT_PCRE2)"
            [ "$src" = "$WANT_PCRE2" ]
            so=check/vectorscan.Rcheck/vectorscan/libs/vectorscan.so
            exported=$(nm -D --defined-only "$so" | awk '$3 ~ /^pcre2_/' | wc -l)
            echo "pcre2_* symbols exported by vectorscan.so: $exported"
            if [ "$WANT_PCRE2" = vendored ] && [ "$exported" -ne 0 ]; then
              echo "::error::the vendored PCRE2 leaks symbols; they could bind to R's PCRE2"
              exit 1
            fi
          fi
