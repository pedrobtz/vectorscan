# Watch Vectorscan for releases, from the shared reusable workflow in
# pedrobtz/r-actions.
#
# vendor.yaml guards against drift -- a vendored file that no longer matches
# the manifest. This guards against staleness, which no amount of green CI
# detects: the pinned copy can sit here while upstream ships fixes. It never
# fails a check; it opens an issue.
on:
  schedule:
    # Mondays, 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:

name: vendor-upstream.yaml

permissions:
  contents: read
  issues: write

jobs:
  # current-version prints the manifest's `tag` column (vectorscan/5.4.13),
  # because upstream tags releases that way and the workflow compares
  # against the tag as published.
  #
  # Pinned to a commit rather than @v1: this job holds an issues write token.
  vectorscan:
    uses: pedrobtz/r-actions/.github/workflows/vendor-upstream.yml@68c22c173f9ddbb7e51284fe230053174e941afc # v1.15.0
    permissions:
      contents: read
      issues: write
    with:
      upstream-repo: VectorCamp/vectorscan
      current-version: awk -F'\t' 'NR > 1 && $1 == "vectorscan" { print $3 }' tools/vendor/manifest.tsv
      tag-pattern: '^vectorscan/[0-9]+(\.[0-9]+){2,3}$'
