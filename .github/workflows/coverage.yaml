on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "23 15 * * 6"
  workflow_dispatch:
  pull_request:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    # Pinned to a commit, not to @v1: this job runs with a repository write
    # token, and a tag is mutable. Update deliberately, with the tag it
    # corresponds to.
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@68c22c173f9ddbb7e51284fe230053174e941afc # v1.15.0
    permissions:
      contents: write
